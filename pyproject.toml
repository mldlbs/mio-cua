[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mio-cua"
version = "0.3.0"
description = "Mio Computer-Use Agent: Windows desktop automation AI agent (SDK + CLI)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests>=2.31",
    "mss>=9.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pynput>=1.7",
    "pywin32>=306",
    "pywinauto>=0.6.8",
    "psutil>=5.9",
    "numpy>=1.24",
    "openai>=1.0",
    # Imported directly by mio_cua.mcp_server (pydantic.Field) -- declared here
    # rather than relying on mcp to pull it in transitively.
    "pydantic>=2.0",
    # The MCP server uses mcp.server.fastmcp, which mcp 2.x renamed to
    # MCPServer; 2.x breaks the server at import time.
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
vision = [
    # rapidocr_onnxruntime 1.4.4 declares requires-python ">=3.6,<3.13"
    # (verified on PyPI), which is why the project itself is capped <3.13.
    "rapidocr_onnxruntime>=1.3.24",
]
gpu = [
    # NOTE: rapidocr pulls plain onnxruntime, which shadows this package (both
    # provide the `onnxruntime` module). After installing, uninstall
    # `onnxruntime` and reinstall `onnxruntime-directml --reinstall` to get
    # DmlExecutionProvider; see README "开发" section.
    "onnxruntime-directml>=1.20",
]
test = [
    "pytest>=7",
]

[project.scripts]
mio-cua = "mio_cua.cli:main"
mio-cua-mcp = "mio_cua.mcp_server:main"

[tool.setuptools.packages.find]
include = ["mio_cua*"]

[tool.setuptools.package-data]
mio_cua = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
