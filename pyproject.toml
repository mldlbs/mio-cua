[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mio-cua"
version = "0.1.5"
description = "Mio Computer-Use Agent: Windows desktop automation AI agent (SDK + CLI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "mss>=9.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pynput>=1.7",
    "pywin32>=306",
    "pywinauto>=0.6.8",
    "psutil>=5.9",
]

[project.optional-dependencies]
vision = [
    "rapidocr_onnxruntime>=1.3.24",
]
gpu = [
    "onnxruntime-directml>=1.20",
]

[project.scripts]
mio-cua = "mio_cua.cli:main"
mio-cua-mcp = "mio_cua.mcp_server:main"

[tool.setuptools.packages.find]
include = ["mio_cua*"]

[tool.setuptools.package-data]
mio_cua = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
